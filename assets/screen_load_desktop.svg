<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
<defs>
  <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="1" fill="#FFFFFF" opacity="0.018" />
  </pattern>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.4" result="blur" />
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="iconOnDark" color-interpolation-filters="sRGB">
    <!-- Convert dark monochrome logos to a soft HUD-white while preserving alpha. -->
    <feColorMatrix type="matrix" values="
      0 0 0 0 0.86
      0 0 0 0 0.95
      0 0 0 0 0.93
      0 0 0 1 0" />
  </filter>
</defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="#070B12" stroke="none" stroke-width="1" opacity="1.0" /><rect x="20" y="20" width="1160" height="635" rx="14" fill="none" stroke="#203044" stroke-width="1.5" opacity="1.0" /><rect x="20" y="20" width="1160" height="635" rx="0" fill="url(#scanlines)" stroke="none" stroke-width="1" opacity="1" /><line x1="38" y1="38" x2="64" y2="38" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><line x1="38" y1="38" x2="38" y2="64" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><line x1="1162" y1="38" x2="1136" y2="38" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><line x1="1162" y1="38" x2="1162" y2="64" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><line x1="38" y1="637" x2="64" y2="637" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><line x1="38" y1="637" x2="38" y2="611" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><line x1="1162" y1="637" x2="1136" y2="637" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><line x1="1162" y1="637" x2="1162" y2="611" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><text x="1146" y="61" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#78909C" text-anchor="end" letter-spacing="2" opacity="1.0">SCREEN 02</text><text x="1146" y="84" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#76F7C5" text-anchor="end" letter-spacing="1.5" opacity="1.0">LOAD // CHARACTER DATA</text><text x="66" y="98" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="34" font-weight="700" fill="#EAF6F4" text-anchor="start" letter-spacing="2" opacity="1.0">LOAD GAME</text><text x="66" y="128" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#78909C" text-anchor="start" letter-spacing="1.5" opacity="1.0">FOUR SAVE FILES // ONE CHARACTER</text><rect x="66" y="165" width="515" height="210" rx="12" fill="#0B111B" stroke="#203044" stroke-width="1.2" opacity="1.0" /><rect x="66" y="165" width="7" height="210" rx="3" fill="#76F7C5" stroke="none" stroke-width="1" opacity="1.0" /><text x="96" y="199" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#76F7C5" text-anchor="start" letter-spacing="1.7" opacity="1.0">SAVE 01</text><text x="96" y="235" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="700" fill="#EAF6F4" text-anchor="start" letter-spacing="0.9" opacity="1.0">DATA ANALYST</text><text x="96" y="261" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#78909C" text-anchor="start" letter-spacing="0.8" opacity="1.0">// patterns over noise</text><text x="96" y="293" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#B8C9D3" text-anchor="start"><tspan x="96" dy="0">I like turning raw data into something structured, reliable</tspan><tspan x="96" dy="19">and actually useful.</tspan></text><rect x="96" y="335" width="82" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="137.0" y="353" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">INSIGHTS</text><rect x="186" y="335" width="75" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="223.5" y="353" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">QUALITY</text><rect x="269" y="335" width="89" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="313.5" y="353" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">STRUCTURE</text><rect x="619" y="165" width="515" height="210" rx="12" fill="#0B111B" stroke="#203044" stroke-width="1.2" opacity="1.0" /><rect x="619" y="165" width="7" height="210" rx="3" fill="#76F7C5" stroke="none" stroke-width="1" opacity="1.0" /><text x="649" y="199" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#76F7C5" text-anchor="start" letter-spacing="1.7" opacity="1.0">SAVE 02</text><text x="649" y="235" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="700" fill="#EAF6F4" text-anchor="start" letter-spacing="0.9" opacity="1.0">SOFTWARE BUILDER</text><text x="649" y="261" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#78909C" text-anchor="start" letter-spacing="0.8" opacity="1.0">// ideas into working systems</text><text x="649" y="293" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#B8C9D3" text-anchor="start"><tspan x="649" dy="0">I enjoy turning ideas into working solutions and</tspan><tspan x="649" dy="19">understanding how things fit together along the way.</tspan></text><rect x="649" y="335" width="82" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="690.0" y="353" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">BUILDING</text><rect x="739" y="335" width="61" 
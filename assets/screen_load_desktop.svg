', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#B8C9D3" text-anchor="start"><tspan x="649" dy="0">I care about the visual side of what I build - from UI to</tspan><tspan x="649" dy="19">how a project is presented.</tspan></text><rect x="649" y="574" width="110" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="704.0" y="592" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">CREATIVE EYE</text><rect x="767" y="574" width="82" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="808.0" y="592" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">SHOWCASE</text><rect x="857" y="574" width="48" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="881.0" y="592" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">UI</text></svg>

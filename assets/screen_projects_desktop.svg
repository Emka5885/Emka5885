<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
<defs>
  <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="1" fill="#FFFFFF" opacity="0.018" />
  </pattern>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.4" result="blur" />
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="iconOnDark" color-interpolation-filters="sRGB">
    <!-- Convert dark monochrome logos to a soft HUD-white while preserving alpha. -->
    <feColorMatrix type="matrix" values="
      0 0 0 0 0.86
      0 0 0 0 0.95
      0 0 0 0 0.93
      0 0 0 1 0" />
  </filter>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100" role="img">
<defs>
  <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="1" fill="#FFFFFF" opacity="0.018" />
  </pattern>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.4" result="blur" />
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="iconOnDark" color-interpolation-filters="sRGB">
    <!-- Convert dark monochrome logos to a soft HUD-white while preserving alpha. -->
    <feColorMatrix type="matrix" values="
      0 0 0 0 0.86
      0 0 0 0 0.95
      0 0 0 0 0.93
      0 0 0 1 0" />
  </filter>
</defs><rect x="0" y="0" width="720" height="1100" rx="0" fill="#070B12" stroke="none" stroke-width="1" opacity="1.0" /><rect x="20" y="20" width="680" height="1060" rx="14" fill="none" stroke="#203044" stroke-width="1.5" opacity="1.0" /><rect x="20" y="20" width="680" height="1060" rx="0" fill="url(#scanlines)" stroke="none" stroke-width="1" opacity="1" /><line x1="38" y1="38" x2="64" y2="38" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><line x1="38" y1="38" x2="38" y2="64" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><line x1="682" y1="38" x2="656" y2="38" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><line x1="682" y1="38" x2="682" y2="64" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><line x1="38" y1="1062" x2="64" y2="1062" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><line x1="38" y1="1062" x2="38" y2="1036" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><line x1="682" y1="1062" x2="656" y2="1062" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><line x1="682" y1="1062" x2="682" y2="1036" stroke="#76F7C5" stroke-width="2" opacity="1.0" /><text x="666" y="61" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#78909C" text-anchor="end" letter-spacing="2" opacity="1.0">SCREEN 02</text><text x="666" y="84" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#76F7C5" text-anchor="end" letter-spacing="1.5" opacity="1.0">LOAD // CHARACTER DATA</text><text x="58" y="103" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="36" font-weight="700" fill="#EAF6F4" text-anchor="start" letter-spacing="2" opacity="1.0">LOAD GAME</text><text x="58" y="134" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#78909C" text-anchor="start" letter-spacing="1.3" opacity="1.0">FOUR SAVE FILES // ONE CHARACTER</text><rect x="58" y="178" width="604" height="190" rx="12" fill="#0B111B" stroke="#203044" stroke-width="1.2" opacity="1.0" /><rect x="58" y="178" width="7" height="190" rx="3" fill="#76F7C5" stroke="none" stroke-width="1" opacity="1.0" /><text x="86" y="209" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#76F7C5" text-anchor="start" letter-spacing="2" opacity="1.0">01</text><text x="86" y="240" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="23" font-weight="700" fill="#EAF6F4" text-anchor="start" letter-spacing="0.8" opacity="1.0">DATA ANALYST</text><text x="86" y="264" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#78909C" text-anchor="start" letter-spacing="0.9" opacity="1.0">SAVE 01 // patterns over noise</text><text x="86" y="296" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#B8C9D3" text-anchor="start"><tspan x="86" dy="0">I like turning raw data into something structured,</tspan><tspan x="86" dy="19">reliable and actually useful.</tspan></text><rect x="86" y="331" width="82" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="127.0" y="349" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">INSIGHTS</text><rect x="176" y="331" width="75" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="213.5" y="349" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">QUALITY</text><rect x="259" y="331" width="89" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="303.5" y="349" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">STRUCTURE</text><rect x="58" y="388" width="604" height="190" rx="12" fill="#0B111B" stroke="#203044" stroke-width="1.2" opacity="1.0" /><rect x="58" y="388" width="7" height="190" rx="3" fill="#76F7C5" stroke="none" stroke-width="1" opacity="1.0" /><text x="86" y="419" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#76F7C5" text-anchor="start" letter-spacing="2" opacity="1.0">02</text><text x="86" y="450" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="23" font-weight="700" fill="#EAF6F4" text-anchor="start" letter-spacing="0.8" opacity="1.0">SOFTWARE BUILDER</text><text x="86" y="474" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#78909C" text-anchor="start" letter-spacing="0.9" opacity="1.0">SAVE 02 // ideas into working systems</text><text x="86" y="506" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#B8C9D3" text-anchor="start"><tspan x="86" dy="0">I enjoy turning ideas into working solutions and</tspan><tspan x="86" dy="19">understanding how things fit together along the way.</tspan></text><rect x="86" y="541" width="82" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="127.0" y="559" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">BUILDING</text><rect x="176" y="541" width="61" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="206.5" y="559" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">LOGIC</text><rect x="245" y="541" width="75" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="282.5" y="559" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">SYSTEMS</text><rect x="58" y="598" width="604" height="190" rx="12" fill="#0B111B" stroke="#203044" stroke-width="1.2" opacity="1.0" /><rect x="58" y="598" width="7" height="190" rx="3" fill="#76F7C5" stroke="none" stroke-width="1" opacity="1.0" /><text x="86" y="629" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#76F7C5" text-anchor="start" letter-spacing="2" opacity="1.0">03</text><text x="86" y="660" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="23" font-weight="700" fill="#EAF6F4" text-anchor="start" letter-spacing="0.8" opacity="1.0">ADAPTIVE MINDSET</text><text x="86" y="684" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#78909C" text-anchor="start" letter-spacing="0.9" opacity="1.0">SAVE 03 // different problems, different tools</text><text x="86" y="716" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#B8C9D3" text-anchor="start"><tspan x="86" dy="0">I enjoy working across different kinds of projects and</tspan><tspan x="86" dy="19">adapting my approach to what each one requires.</tspan></text><rect x="86" y="751" width="61" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="116.5" y="769" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">ADAPT</text><rect x="155" y="751" width="68" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="189.0" y="769" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">EVOLVE</text><rect x="231" y="751" width="75" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="268.5" y="769" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">EXPLORE</text><rect x="58" y="808" width="604" height="190" rx="12" fill="#0B111B" stroke="#203044" stroke-width="1.2" opacity="1.0" /><rect x="58" y="808" width="7" height="190" rx="3" fill="#76F7C5" stroke="none" stroke-width="1" opacity="1.0" /><text x="86" y="839" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#76F7C5" text-anchor="start" letter-spacing="2" opacity="1.0">04</text><text x="86" y="870" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="23" font-weight="700" fill="#EAF6F4" text-anchor="start" letter-spacing="0.8" opacity="1.0">VISUAL THINKING</text><text x="86" y="894" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#78909C" text-anchor="start" letter-spacing="0.9" opacity="1.0">SAVE 04 // beyond functionality</text><text x="86" y="926" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#B8C9D3" text-anchor="start"><tspan x="86" dy="0">I like taking care of the visual side of what I build -</tspan><tspan x="86" dy="19">from interfaces and layout to the way a project is</tspan></text><rect x="86" y="961" width="110" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="141.0" y="979" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">CREATIVE EYE</text><rect x="204" y="961" width="82" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="245.0" y="979" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">SHOWCASE</text><rect x="294" y="961" width="48" height="26" rx="6" fill="#0E1622" stroke="#203044" stroke-width="1" opacity="1.0" /><text x="318.0" y="979" font-family="'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#78909C" text-anchor="middle" letter-spacing="0.5" opacity="1.0">UI</text></svg>
